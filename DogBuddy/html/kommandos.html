<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DogBuddy - Kommandos</title>

    <link
        rel="stylesheet"
        href="../css/styles.css"
    >

</head>


<body>


    <!-- ================================================== -->
    <!-- HAUPTINHALT                                        -->
    <!-- ================================================== -->

    <main class="discovery-page">


        <!-- ================================================== -->
        <!-- ÜBERSCHRIFT                                        -->
        <!-- ================================================== -->

        <section class="discovery-page-header">

            <p class="eyebrow">
                KOMMANDOZEIT
            </p>

            <h1>
                🐾
                <span id="page-dog-name">
                    Major
                </span>s Kommandos
            </h1>

            <p>
                Neue Kommandos kennenlernen,
                gemeinsam ausprobieren und
                irgendwann ganz entspannt beherrschen.
            </p>

        </section>



        <!-- ================================================== -->
        <!-- FORTSCHRITT                                        -->
        <!-- ================================================== -->

        <section class="discovery-progress">

            <p class="eyebrow">
                FORTSCHRITT
            </p>

            <h2>
                Majors Kommandostatus
            </h2>


            <div class="discovery-progress-grid">


                <!-- KENNENGELERNT -->

                <div class="discovery-progress-item">

                    <strong id="progress-seen">
                        👀 Kennengelernt: 0 %
                    </strong>

                </div>


                <!-- SELBST ERLEBT -->

                <div class="discovery-progress-item">

                    <strong id="progress-experienced">
                        🐾 Selbst erlebt: 0 %
                    </strong>

                </div>


                <!-- ENTSPANNT DABEI -->

                <div class="discovery-progress-item">

                    <strong id="progress-relaxed">
                        😌 Entspannt dabei: 0 %
                    </strong>

                </div>


            </div>

        </section>



        <!-- ================================================== -->
        <!-- KOMMANDO-CHECKLISTE                                -->
        <!-- ================================================== -->

        <section class="discovery-checklist-section">

            <div id="command-checklist">

                <!--
                    Die komplette Kommandoliste wird
                    automatisch durch kommandos.js erstellt.

                    Kategorien:

                    🔴 Sicherheitskommandos
                    🟠 Grundkommandos
                    🟡 Praktisch im Alltag
                    💩 Lösen
                    🐒 Spezialkommandos & Tricks
                -->

            </div>

        </section>


    </main>



    <!-- ================================================== -->
    <!-- JAVASCRIPT                                         -->
    <!-- ================================================== -->

    <!-- Kommandos -->
    <script src="../js/kommandos.js"></script>

    <!-- Gemeinsamer Header -->
    <script src="../js/header.js"></script>

    <!-- Footer zuerst erstellen -->
    <script src="../js/footer.js"></script>

    <!-- Backup-Funktionen -->
    <script src="../js/backup.js"></script>

    <!-- Scroll-to-Top -->
    <script src="../js/scroll-top.js"></script>

    <!-- Dark Mode -->
    <script src="../js/dark-mode.js"></script>


</body>

</html>
