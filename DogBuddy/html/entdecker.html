<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DogBuddy - Entdecker-Checkliste</title>

    <link
        rel="stylesheet"
        href="../css/styles.css"
    >
</head>


<body>


    <!-- ========================================== -->
    <!-- HAUPTINHALT -->
    <!-- ========================================== -->

    <main class="discovery-page">


        <!-- ====================================== -->
        <!-- ÜBERSCHRIFT -->
        <!-- ====================================== -->

        <section class="page-header">

            <div class="page-header-text">
            
                <p class="page-eyebrow">
                    ENTDECKERZEIT
                </p>
            
                <h1 class="page-main-title">
                    <span id="page-dog-name">
                        Major
                    </span>s große Entdecker-Checkliste
                </h1>
            
                <p class="page-subtitle">
                    Neue Situationen kennenlernen,
                    selbst erleben und irgendwann
                    ganz entspannt meistern.
                </p>
            
            </div>
        
            <!-- POPUP ÖFFNEN -->
            <button
                type="button"
                id="add-discovery-button"
                class="gallery-add-button"
            >
                + Entdeckung hinzufügen
            </button>
        
        </section>


        <!-- ====================================== -->
        <!-- FORTSCHRITT -->
        <!-- ====================================== -->

        <section class="discovery-progress">

            <p class="eyebrow">
                FORTSCHRITT
            </p>

            <h2>
                Majors Entdeckerstatus
            </h2>


            <div class="discovery-progress-grid">

                <div class="discovery-progress-item">

                    <strong id="progress-seen">
                        0 %
                    </strong>

                </div>


                <div class="discovery-progress-item">

                    <strong id="progress-experienced">
                        0 %
                    </strong>

                </div>


                <div class="discovery-progress-item">

                    <strong id="progress-relaxed">
                        0 %
                    </strong>

                </div>

            </div>

        </section>


        <!-- ====================================== -->
        <!-- ENTDECKER-CHECKLISTE -->
        <!-- ====================================== -->

        <section class="discovery-checklist-section">

            <div id="discovery-checklist">

                <!--
                    Die komplette Checkliste
                    wird später automatisch
                    durch entdecker.js erstellt.
                -->

            </div>

        </section>


        </main>


        <!-- ========================================== -->
        <!-- POPUP - ENTDECKER ERFOLG -->
        <!-- ========================================== -->

        <div
            id="discovery-achievement-modal"
            class="app-modal"
        >

            <div class="app-modal-content achievement-content">
            
                <div class="achievement-body">

                    <!-- ================================================== -->
                    <!-- ALTER ERFOLGSINHALT                                -->
                    <!-- ================================================== -->


                    <!-- ERFOLGSBILD - ALT

                    <div class="achievement-image-wrapper">
                    
                        <img
                            id="discovery-achievement-profile-image"
                            class="achievement-profile-image"
                            src=""
                            alt="Profilbild des Hundes"
                        >
                    
                        <div
                            id="achievement-icon"
                            class="achievement-icon"
                        >
                            🐾
                        </div>
                    
                    </div>
                
                    -->
                
                
                    <!-- KLEINE ÜBERSCHRIFT - ALT
                
                    <p class="eyebrow">
                        ENTDECKER-ERFOLG
                    </p>
                
                    -->
                
                
                    <!-- ERFOLGS-TITEL - ALT
                
                    <h2 id="achievement-title">
                        Du bist ein echter Entdecker!
                    </h2>
                
                    -->
                
                
                    <!-- ERFOLGS-TEXT - ALT
                
                    <p
                        id="achievement-text"
                        class="achievement-text"
                    ></p>
                
                    -->
                
                
                    <!-- PROZENT - ALT
                
                    <div
                        id="achievement-percent"
                        class="achievement-percent"
                    >
                        25 %
                    </div>
                
                    -->
                
                    <!-- ================================================== -->
                    <!-- NEUES ERFOLGSBILD                                  -->
                    <!-- ================================================== -->

                    <img
                        id="discovery-achievement-image"
                        class="discovery-achievement-image"
                        src=""
                        alt="Entdecker-Erfolg"
                    >

                    
                    <!-- ================================================== -->
                    <!-- POPUP SCHLIESSEN                                   -->
                    <!-- ================================================== -->
                
                    <button
                        type="button"
                        id="close-achievement-modal"
                        class="achievement-close"
                        aria-label="Popup schließen"
                    >
                        ×
                    </button>
                
                </div>
            
            </div>
        
        </div>


        <!-- ================================================== -->
        <!-- EIGENE ENTDECKUNG - POPUP                          -->
        <!-- ================================================== -->

        <div
            id="discovery-editor-modal"
            class="app-modal"
            hidden
        >

            <div class="app-modal-content">
            
            
                <!-- ================================================== -->
                <!-- KOPF                                               -->
                <!-- ================================================== -->
            
                <div class="app-modal-header">

                    <div>
                    
                        <p class="eyebrow">
                            ENTDECKUNG
                        </p>
                    
                        <h2 id="discovery-editor-title">
                            Entdeckung hinzufügen
                        </h2>
                    
                    </div>
                
                
                    <!-- ================================================== -->
                    <!-- POPUP SCHLIESSEN                                   -->
                    <!-- ================================================== -->
                
                    <button
                        type="button"
                        id="close-discovery-editor"
                        class="app-modal-close"
                        aria-label="Popup schließen"
                    >
                        ×
                    </button>
                
                </div>
            
            
                <!-- ================================================== -->
                <!-- INHALT                                             -->
                <!-- ================================================== -->
            
                <div class="app-modal-body">
                
                    <label for="discovery-editor-name">
                        Name
                    </label>
                
                    <input
                        type="text"
                        id="discovery-editor-name"
                        autocomplete="off"
                        placeholder="z. B. Busbahnhof anschauen"
                    >
                
                
                    <label for="discovery-editor-note">
                        Notiz
                    </label>
                
                    <textarea
                        id="discovery-editor-note"
                        rows="3"
                        placeholder="z. B. Erst einmal mit Abstand beobachten"
                    ></textarea>
                
                
                    <!-- ================================================== -->
                    <!-- ÄHNLICHE ENTDECKUNGEN                              -->
                    <!-- ================================================== -->
                
                    <div
                        id="discovery-suggestions"
                        class="discovery-suggestions"
                        hidden
                    >
                
                        <p class="discovery-suggestions-title">
                            Ähnliche Entdeckungen bereits vorhanden:
                        </p>
                    
                        <div id="discovery-suggestions-list"></div>
                    
                    </div>
                
                </div>
            
            
                <!-- ================================================== -->
                <!-- BUTTONS                                            -->
                <!-- ================================================== -->
            
                <div class="app-modal-buttons">
                
                    <button
                        type="button"
                        id="discovery-editor-delete"
                        class="app-cancel-button"
                        hidden
                    >
                        Löschen
                    </button>
                
                    <button
                        type="button"
                        id="discovery-editor-cancel"
                        class="app-cancel-button"
                    >
                        Abbrechen
                    </button>
                
                    <button
                        type="button"
                        id="discovery-editor-save"
                        class="primary-button"
                    >
                        🐾 Speichern
                    </button>
                
                </div>
            
            </div>
        
        </div>
    
    
        <!-- ========================================== -->
        <!-- JAVASCRIPT                                 -->
        <!-- ========================================== -->

        <!-- Entdecker ErfolgspopUp -->
        <script src="../js/entdecker-achievements.js"></script>

        <!-- Eigenes JavaScript der jeweiligen Seite -->
        <script src="../js/entdecker.js"></script>

        <!-- Gemeinsamer Header -->
        <script src="../js/header.js"></script>

        <!-- Footer zuerst erstellen -->
        <script src="../js/footer.js"></script>

        <!-- Danach die Backup-Funktionen verbinden -->
        <script src="../js/backup.js"></script>

        <!-- Scroll-to-Top -->
        <script src="../js/scroll-top.js"></script>

        <!-- Schwebendes Navigationsmenü -->
        <script src="../js/floating-menu.js"></script>

        <!-- Dark Mode -->
        <script src="../js/dark-mode.js"></script>

    </body>

</html>
