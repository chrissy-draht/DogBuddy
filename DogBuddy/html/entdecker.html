<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DogBuddy - Entdecker-Checkliste</title>

    <link
        rel="stylesheet"
        href="../css/styles.css"
    >
</head>


<body>


    <!-- ========================================== -->
    <!-- HAUPTINHALT -->
    <!-- ========================================== -->

    <main class="discovery-page">


        <!-- ====================================== -->
        <!-- ÜBERSCHRIFT -->
        <!-- ====================================== -->

        <section class="discovery-page-header">

            <p class="eyebrow">
                ENTDECKERZEIT
            </p>

            <h1>
                🐾
                <span id="page-dog-name">
                    Major
                </span>s große Entdecker-Checkliste
            </h1>

            <p>
                Neue Situationen kennenlernen,
                selbst erleben und irgendwann
                ganz entspannt meistern.
            </p>

        </section>


        <!-- ====================================== -->
        <!-- FORTSCHRITT -->
        <!-- ====================================== -->

        <section class="discovery-progress">

            <p class="eyebrow">
                FORTSCHRITT
            </p>

            <h2>
                Majors Entdeckerstatus
            </h2>


            <div class="discovery-progress-grid">

                <div class="discovery-progress-item">

                    <strong id="progress-seen">
                        0 %
                    </strong>

                </div>


                <div class="discovery-progress-item">

                    <strong id="progress-experienced">
                        0 %
                    </strong>

                </div>


                <div class="discovery-progress-item">

                    <strong id="progress-relaxed">
                        0 %
                    </strong>

                </div>

            </div>

        </section>


        <!-- ====================================== -->
        <!-- ENTDECKER-CHECKLISTE -->
        <!-- ====================================== -->

        <section class="discovery-checklist-section">

            <div id="discovery-checklist">

                <!--
                    Die komplette Checkliste
                    wird später automatisch
                    durch entdecker.js erstellt.
                -->

            </div>

        </section>


        </main>


        <!-- ========================================== -->
        <!-- POPUP - ENTDECKER ERFOLG -->
        <!-- ========================================== -->
        
        <div
            id="discovery-achievement-modal"
            class="app-modal"
        >
        
            <div class="app-modal-content discovery-achievement-content">
            
                <div class="discovery-achievement-body">
                
                
                    <!-- ERFOLGS-ICON -->
                
                    <div
                        id="achievement-icon"
                        class="discovery-achievement-icon"
                    >
                        🐾
                    </div>
                
                
                    <!-- KLEINE ÜBERSCHRIFT -->
                
                    <p class="eyebrow">
                        ENTDECKER-ERFOLG
                    </p>
                
                
                    <!-- ERFOLGS-TITEL -->
                
                    <h2 id="achievement-title">
                        Du bist ein echter Entdecker!
                    </h2>
                
                
                    <!-- ERFOLGS-TEXT -->
                
                    <p
                        id="achievement-text"
                        class="discovery-achievement-text"
                    ></p>
                
                
                    <!-- PROZENT -->
                
                    <div
                        id="achievement-percent"
                        class="discovery-achievement-percent"
                    >
                        25 %
                    </div>
                
                
                    <!-- POPUP SCHLIESSEN -->
                
                    <button
                        type="button"
                        id="close-achievement-modal"
                        class="primary-button"
                    >
                        Weiter entdecken
                    </button>
                
                
                </div>
            
            </div>
        
        </div>
    
    
        <!-- ========================================== -->
        <!-- JAVASCRIPT                                 -->
        <!-- ========================================== -->

        <!-- Eigenes JavaScript der jeweiligen Seite -->
        <script src="../js/entdecker.js"></script>

        <!-- Gemeinsamer Header -->
        <script src="../js/header.js"></script>

        <!-- Footer zuerst erstellen -->
        <script src="../js/footer.js"></script>

        <!-- Danach die Backup-Funktionen verbinden -->
        <script src="../js/backup.js"></script>

        <!-- Scroll-to-Top -->
        <script src="../js/scroll-top.js"></script>

        <!-- Dark Mode -->
        <script src="../js/dark-mode.js"></script>

    </body>

</html>
