<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DogBuddy - Tagebuch</title>

    <link
        rel="stylesheet"
        href="../css/styles.css"
    >
</head>


<body>


    <!-- ================================================== -->
    <!-- HAUPTINHALT -->
    <!-- ================================================== -->

    <main class="diary-page">


        <!-- ================================================== -->
        <!-- KOPFBEREICH -->
        <!-- ================================================== -->

        <section class="page-header">

            <div class="page-header-text">
            
                <p class="page-eyebrow">
                    TAGEBUCH
                </p>
            
                <h1 class="page-main-title">
                    <span id="page-dog-name">Major</span>s Tagebuch
                </h1>
            
                <p class="page-subtitle">
                    Besondere Momente, Fortschritte und Erinnerungen
                    gemeinsam festhalten.
                </p>
            
            </div>
        
            <!-- POPUP ÖFFNEN -->
            <button
                type="button"
                id="open-diary-form"
                class="gallery-add-button"
            >
                <span class="gallery-add-icon">
                    ＋
                </span>
            
                Neuer Tagebucheintrag
            </button>
        
        </section>


        <!-- ================================================== -->
        <!-- BISHERIGE TAGEBUCHEINTRÄGE -->
        <!-- ================================================== -->

        <section class="diary-history">

            <div class="diary-history-header">

                <div>

                    <p class="eyebrow">
                        ERINNERUNGEN
                    </p>

                    <h2>
                        Bisherige Einträge
                    </h2>

                </div>

            </div>


            <!-- JavaScript fügt hier die Einträge ein -->

            <div id="diary-list">

                <p class="empty-info">
                    Noch kein Tagebucheintrag vorhanden.
                </p>

            </div>

        </section>

    </main>


    <!-- ================================================== -->
    <!-- POPUP: TAGEBUCHEINTRAG -->
    <!-- ================================================== -->

    <div
        id="diary-form-modal"
        class="app-modal"
    >

        <div class="app-modal-content diary-modal-content">


            <!-- ================================================== -->
            <!-- POPUP-KOPF -->
            <!-- ================================================== -->

            <div class="app-modal-header">

                <div>
                
                    <p class="eyebrow">
                        TAGEBUCH
                    </p>
                
                    <h2 id="diary-form-title">
                        Neuer Tagebucheintrag
                    </h2>
                
                </div>
            
            
                <div class="diary-header-actions">
                
                    <!-- FOTOS UND VIDEOS HINZUFÜGEN -->

                    <label
                        for="diary-photos"
                        class="photo-upload-button"
                    >
                        Fotos / Videos hinzufügen
                    </label>

                    <input
                        type="file"
                        id="diary-photos"
                        accept="image/*,video/*"
                        multiple
                        hidden
                    >
                
                    <button
                        type="button"
                        id="close-diary-form"
                        class="app-modal-close"
                        aria-label="Fenster schließen"
                    >
                        ×
                    </button>
                
                </div>
            
            </div>


            <!-- ================================================== -->
            <!-- FORMULAR -->
            <!-- ================================================== -->

            <div class="app-modal-body">

            <!-- FOTO-VORSCHAU -->

            <div
                id="photo-preview"
                class="photo-preview"
            ></div>


                <!-- DATUM -->

                <div class="diary-form-group">

                    <label for="diary-date">
                        Datum
                    </label>

                    <input
                        type="date"
                        id="diary-date"
                    >

                </div>


                <!-- TITEL -->

                <div class="diary-form-group">

                    <label for="diary-title">
                        Titel
                    </label>

                    <input
                        type="text"
                        id="diary-title"
                        placeholder="z. B. Erstes Mal schwimmen"
                    >

                </div>


                <!-- HEUTE GELERNT -->

                <div class="diary-form-group">

                    <label for="diary-learned">
                        Heute gelernt
                    </label>

                    <textarea
                        id="diary-learned"
                        rows="3"
                        placeholder="Was hat Major heute Neues gelernt?"
                    ></textarea>

                </div>


                <!-- DAS LIEF GUT -->

                <div class="diary-form-group">

                    <label for="diary-good">
                        Das lief gut
                    </label>

                    <textarea
                        id="diary-good"
                        rows="3"
                        placeholder="Was hat heute besonders gut funktioniert?"
                    ></textarea>

                </div>


                <!-- DAS WAR SCHWIERIG -->

                <div class="diary-form-group">

                    <label for="diary-difficult">
                        Das war schwierig
                    </label>

                    <textarea
                        id="diary-difficult"
                        rows="3"
                        placeholder="Was war heute noch schwierig?"
                    ></textarea>

                </div>


                <!-- BESONDERER MOMENT -->

                <div class="diary-form-group">

                    <label for="diary-highlight">
                        Besonderer Moment
                    </label>

                    <textarea
                        id="diary-highlight"
                        rows="3"
                        placeholder="Gab es einen besonderen oder lustigen Moment?"
                    ></textarea>

                </div>


                <!-- SONSTIGE NOTIZEN -->

                <div class="diary-form-group">

                    <label for="diary-note">
                        Sonstige Notizen
                    </label>

                    <textarea
                        id="diary-note"
                        rows="4"
                        placeholder="Alles, was du sonst noch festhalten möchtest."
                    ></textarea>

                </div>
            </div>

            <!-- ================================================== -->
            <!-- POPUP-BUTTONS -->
            <!-- ================================================== -->

            <div class="app-modal-buttons">
            
                <button
                    type="button"
                    id="cancel-diary-form"
                    class="app-cancel-button"
                >
                    Abbrechen
                </button>
            
                <button
                    type="button"
                    id="save-diary"
                    class="primary-button"
                >
                    🐾 Speichern
                </button>
            
            </div>

        </div>

    </div>


    <!-- ================================================== -->
    <!-- JAVASCRIPT -->
    <!-- ================================================== -->

    <!-- Tagebuch -->
    <script src="../js/tagebuch.js"></script>

    <!-- Gemeinsamer Header -->
    <script src="../js/header.js"></script>

    <!-- Footer zuerst erstellen -->
    <script src="../js/footer.js"></script>

    <!-- Backup-Funktionen -->
    <script src="../js/backup.js"></script>

    <!-- Scroll-to-Top -->
    <script src="../js/scroll-top.js"></script>

    <!-- Schwebendes Navigationsmenü -->
    <script src="../js/floating-menu.js"></script>

    <!-- Dark Mode -->
    <script src="../js/dark-mode.js"></script>

</body>

</html>
