<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DogBuddy - Training</title>

    <link
        rel="stylesheet"
        href="../css/styles.css"
    >
</head>


<body>


    <!-- ========================================== -->
    <!-- HAUPTINHALT -->
    <!-- ========================================== -->

    <main class="training-page">


        <!-- ====================================== -->
        <!-- ÜBERSCHRIFT -->
        <!-- ====================================== -->

        <section class="training-header">
        
            <div>
            
                <p class="eyebrow">
                    TRAINING
                </p>
            
                <h1>
                    <span id="page-dog-name">Major</span>s Training
                </h1>
            
                <p>
                    Übungen, Fortschritte und neue Erfahrungen
                    im Blick behalten.
                </p>
            
            </div>
        
        </section>

        
            <!-- ====================================== -->
            <!-- TRAININGSSTAND -->
            <!-- ====================================== -->
                    
            <section class="training-overview">
            
                <div class="training-overview-header">
                
                    <div>
                    
                        <p class="eyebrow">
                            ÜBERSICHT
                        </p>
                    
                        <h2>
                            Trainingsstand
                        </h2>
                    
                    </div>
                
                
                    <!-- POPUP ÖFFNEN -->
                
                    <button
                        type="button"
                        id="open-training-form"
                        class="gallery-add-button"
                    >
                
                        <span class="gallery-add-icon">
                            ＋
                        </span>
                    
                        Neue Übung
                    
                    </button>
                
                </div>
            
            
                <div id="training-list">
                
                    <!--
                        Hier fügt training.js
                        automatisch die gespeicherten
                        Übungen ein.
                    -->
                
                </div>
            
            </section>


    <!-- ========================================== -->
    <!-- POPUP - NEUE ÜBUNG -->
    <!-- ========================================== -->

    <div
        id="training-form-modal"
        class="app-modal"
    >

        <div class="app-modal-content">


            <!-- ================================== -->
            <!-- POPUP KOPF -->
            <!-- ================================== -->

            <div class="app-modal-header">

                <div>

                    <p class="eyebrow">
                        TRAINING
                    </p>

                    <h2 id="training-form-title">
                        Neue Übung
                    </h2>

                </div>


                <button
                    type="button"
                    id="close-training-form"
                    class="app-modal-close"
                    aria-label="Popup schließen"
                >
                    ×
                </button>

            </div>


            <!-- ================================== -->
            <!-- POPUP INHALT -->
            <!-- ================================== -->

            <div class="app-modal-body">


                <!-- ÜBUNG -->

                <div class="training-form-group">

                    <label for="training-name">
                        Übung
                    </label>

                    <input
                        type="text"
                        id="training-name"
                        placeholder="z. B. Rückruf"
                    >

                </div>


                <!-- DATUM -->

                <div class="training-form-group">

                    <label for="training-date">
                        Datum
                    </label>

                    <input
                        type="date"
                        id="training-date"
                    >

                </div>


                <!-- BEWERTUNG -->

                <div class="training-form-group">

                    <label>
                        Aktueller Trainingsstand
                    </label>


                    <div
                        class="star-rating"
                        id="star-rating"
                    >

                        <button
                            type="button"
                            class="star"
                            data-value="1"
                        >
                            ☆
                        </button>

                        <button
                            type="button"
                            class="star"
                            data-value="2"
                        >
                            ☆
                        </button>

                        <button
                            type="button"
                            class="star"
                            data-value="3"
                        >
                            ☆
                        </button>

                        <button
                            type="button"
                            class="star"
                            data-value="4"
                        >
                            ☆
                        </button>

                        <button
                            type="button"
                            class="star"
                            data-value="5"
                        >
                            ☆
                        </button>

                    </div>


                    <span
                        class="rating-text"
                        id="rating-text"
                    >
                        Noch keine Bewertung
                    </span>

                </div>


                <!-- NOTIZ -->

                <div class="training-form-group">

                    <label for="training-note">
                        Notiz
                    </label>

                    <textarea
                        id="training-note"
                        rows="4"
                        placeholder="z. B. Klappt im Garten schon sehr gut."
                    ></textarea>

                </div>


            </div>


            <!-- ================================== -->
            <!-- POPUP BUTTONS -->
            <!-- ================================== -->

            <div class="app-modal-buttons">

                <button
                    type="button"
                    id="cancel-training-form"
                    class="app-cancel-button"
                >
                    Abbrechen
                </button>


                <button
                    type="button"
                    id="save-training"
                    class="primary-button"
                >
                    Übung speichern
                </button>

            </div>


        </div>

    </div>


    <!-- ========================================== -->
    <!-- JAVASCRIPT -->
    <!-- ========================================== -->

    <!-- Training -->
    <script src="../js/training.js"></script>

    <!-- Gemeinsamer Header -->
    <script src="../js/header.js"></script>

    <!-- Footer zuerst erstellen -->
    <script src="../js/footer.js"></script>

    <!-- Backup-Funktionen -->
    <script src="../js/backup.js"></script>

    <!-- Scroll-to-Top -->
    <script src="../js/scroll-top.js"></script>

    <!-- Dark Mode -->
    <script src="../js/dark-mode.js"></script>

</body>

</html>
