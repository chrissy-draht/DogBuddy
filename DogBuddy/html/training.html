<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DogBuddy - Training</title>

    <link
        rel="stylesheet"
        href="../css/styles.css"
    >
</head>


<body>

    <!-- ========================================== -->
    <!-- HEADER -->
    <!-- ========================================== -->

    <header class="header">

        <a href="../index.html">

            <img
                src="../images/logo/dogbuddy-logo-full-blank.png"
                alt="DogBuddy Logo"
                class="logo"
            >

        </a>


        <nav class="navigation">

            <a href="../index.html">
                Dashboard
            </a>

            <a href="tagebuch.html">
                Tagebuch
            </a>

            <a
                href="training.html"
                class="active"
            >
                Training
            </a>

            <a href="entwicklung.html">
                Entwicklung
            </a>

            <a href="wochenplan.html">
                Wochenplan
            </a>

            <a href="gesundheit.html">
                Gesundheit
            </a>

            <a href="galerie.html">
                Galerie
            </a>

        </nav>

    </header>


    <!-- ========================================== -->
    <!-- HAUPTINHALT -->
    <!-- ========================================== -->

    <main class="training-page">


        <!-- ====================================== -->
        <!-- ÜBERSCHRIFT -->
        <!-- ====================================== -->

        <section class="training-header">

            <p class="eyebrow">
                TRAINING
            </p>

            <h1>
                Majors Training
            </h1>

            <p>
                Übungen und Fortschritte im Blick behalten.
            </p>

        </section>


        <!-- ====================================== -->
        <!-- NEUE ÜBUNG -->
        <!-- ====================================== -->

        <section class="training-form-card">

            <h2>
                Neue Übung hinzufügen
            </h2>


            <!-- ÜBUNG -->

            <div class="training-form-group">

                <label for="training-name">
                    Übung
                </label>

                <input
                    type="text"
                    id="training-name"
                    placeholder="z. B. Rückruf"
                >

            </div>


            <!-- DATUM -->

            <div class="training-form-group">

                <label for="training-date">
                    Datum
                </label>

                <input
                    type="date"
                    id="training-date"
                >

            </div>


            <!-- BEWERTUNG -->

            <div class="training-form-group">

                <label>
                    Aktueller Trainingsstand
                </label>

                <div
                    class="star-rating"
                    id="star-rating"
                >

                    <button
                        type="button"
                        class="star"
                        data-value="1"
                    >
                        ☆
                    </button>

                    <button
                        type="button"
                        class="star"
                        data-value="2"
                    >
                        ☆
                    </button>

                    <button
                        type="button"
                        class="star"
                        data-value="3"
                    >
                        ☆
                    </button>

                    <button
                        type="button"
                        class="star"
                        data-value="4"
                    >
                        ☆
                    </button>

                    <button
                        type="button"
                        class="star"
                        data-value="5"
                    >
                        ☆
                    </button>

                </div>


                <span
                    class="rating-text"
                    id="rating-text"
                >
                    Noch keine Bewertung
                </span>

            </div>


            <!-- NOTIZ -->

            <div class="training-form-group">

                <label for="training-note">
                    Notiz
                </label>

                <textarea
                    id="training-note"
                    rows="4"
                    placeholder="z. B. Klappt im Garten schon sehr gut."
                ></textarea>

            </div>


            <!-- SPEICHERN -->

            <button
                type="button"
                id="save-training"
                class="primary-button"
            >
                + Übung speichern
            </button>

        </section>


        <!-- ====================================== -->
        <!-- TRAININGSSTAND -->
        <!-- ====================================== -->

        <section class="training-overview">

            <h2>
                Trainingsstand
            </h2>


            <div id="training-list">

                <!--
                    Hier fügt training.js
                    automatisch die gespeicherten
                    Übungen ein.
                -->

            </div>

        </section>


    </main>


    <!-- ========================================== -->
    <!-- JAVASCRIPT -->
    <!-- ========================================== -->

    <script src="../js/training.js"></script>

</body>

</html>
