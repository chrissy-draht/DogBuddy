<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Wochenplan | DogBuddy</title>

    <link
        rel="stylesheet"
        href="../css/styles.css"
    >

</head>


<body>


    <!-- ========================================== -->
    <!-- HAUPTINHALT -->
    <!-- ========================================== -->

    <main class="weekly-page">


        <!-- ====================================== -->
        <!-- ÜBERSCHRIFT -->
        <!-- ====================================== -->

        <section class="weekly-header">

            <div>

                <p class="small-heading">
                    WOCHENPLAN
                </p>

                <h1>
                    <span id="page-dog-name">Major</span>s Woche 🐾
                </h1>

                <p>
                    Hier plane ich, was ich diese Woche
                    mit <span id="page-dog-name-text">Major</span> üben, erleben oder erledigen möchte.
                </p>

            </div>


            <!-- POPUP ÖFFNEN -->

            <button
                type="button"
                id="open-weekly-form"
                class="gallery-add-button"
            >

                <span class="gallery-add-icon">
                    ＋
                </span>

                Neue Aufgabe

            </button>

        </section>


        <!-- ====================================== -->
        <!-- OFFENE AUFGABEN -->
        <!-- ====================================== -->

        <section class="weekly-section">

            <div class="weekly-section-header">

                <div>

                    <p class="small-heading">
                        DIESE WOCHE
                    </p>

                    <h2>
                        Offene Aufgaben
                    </h2>

                </div>


                <span
                    class="weekly-counter"
                    id="open-weekly-count"
                >
                    0
                </span>

            </div>


            <div id="open-weekly-tasks">

                <p class="empty-weekly">
                    Noch keine Aufgaben geplant.
                </p>

            </div>

        </section>


        <!-- ====================================== -->
        <!-- ERLEDIGTE AUFGABEN -->
        <!-- ====================================== -->

        <section class="weekly-section completed-weekly-section">

            <div class="weekly-section-header">

                <div>

                    <p class="small-heading">
                        GESCHAFFT
                    </p>

                    <h2>
                        Erledigte Aufgaben
                    </h2>

                </div>


                <span
                    class="weekly-counter"
                    id="completed-weekly-count"
                >
                    0
                </span>

            </div>


            <div id="completed-weekly-tasks">

                <p class="empty-weekly">
                    Noch keine Aufgabe erledigt.
                </p>

            </div>

        </section>


    </main>


    <!-- ========================================== -->
    <!-- POPUP - AUFGABE -->
    <!-- ========================================== -->

    <div
        id="weekly-form-modal"
        class="app-modal"
    >

        <div class="app-modal-content">


            <!-- ================================== -->
            <!-- POPUP KOPF -->
            <!-- ================================== -->

            <div class="app-modal-header">

                <div>

                    <p class="small-heading">
                        WOCHENPLAN
                    </p>

                    <h2 id="weekly-form-title">
                        Neue Aufgabe
                    </h2>

                </div>


                <button
                    type="button"
                    id="close-weekly-form"
                    class="app-modal-close"
                    aria-label="Popup schließen"
                >
                    ×
                </button>

            </div>


            <!-- ================================== -->
            <!-- POPUP INHALT -->
            <!-- ================================== -->

            <div class="app-modal-body">


                <!-- KATEGORIE -->

                <div class="weekly-form-group">

                    <label for="weekly-category">
                        Kategorie
                    </label>

                    <select id="weekly-category">

                        <option value="Training">
                            ⭐ Training
                        </option>

                        <option value="Sozialisierung">
                            🐕 Sozialisierung
                        </option>

                        <option value="Ausflug">
                            🌲 Ausflug
                        </option>

                        <option value="Pflege">
                            ✂️ Pflege
                        </option>

                        <option value="Sonstiges">
                            📌 Sonstiges
                        </option>

                    </select>

                </div>


                <!-- AUFGABE -->

                <div class="weekly-form-group">

                    <label for="weekly-title">
                        Aufgabe
                    </label>

                    <input
                        type="text"
                        id="weekly-title"
                        placeholder="z. B. Rückruf üben"
                    >

                </div>


                <!-- NOTIZ / ZIEL -->

                <div class="weekly-form-group">

                    <label for="weekly-note">
                        Notiz / Ziel
                    </label>

                    <textarea
                        id="weekly-note"
                        rows="4"
                        placeholder="z. B. 3 kurze Einheiten draußen"
                    ></textarea>

                </div>


                <!-- STATUS -->

                <div class="weekly-form-group">

                    <label>
                        Status
                    </label>


                    <div class="weekly-status-selection">

                        <label>

                            <input
                                type="radio"
                                name="weekly-status"
                                value="open"
                                checked
                            >

                            Offen

                        </label>


                        <label>

                            <input
                                type="radio"
                                name="weekly-status"
                                value="completed"
                            >

                            Erledigt

                        </label>

                    </div>

                </div>


            </div>


            <!-- ================================== -->
            <!-- POPUP BUTTONS -->
            <!-- ================================== -->

            <div class="app-modal-buttons">

                <button
                    type="button"
                    id="cancel-weekly-form"
                    class="app-cancel-button"
                >
                    Abbrechen
                </button>


                <button
                    type="button"
                    id="save-weekly-task"
                    class="primary-button"
                >
                    Aufgabe speichern
                </button>

            </div>


        </div>

    </div>


    <!-- ========================================== -->
    <!-- JAVASCRIPT -->
    <!-- ========================================== -->

    <!-- Wochenplan -->
    <script src="../js/wochenplan.js"></script>

    <!-- Gemeinsamer Header -->
    <script src="../js/header.js"></script>

    <!-- Footer zuerst erstellen -->
    <script src="../js/footer.js"></script>

    <!-- Backup-Funktionen -->
    <script src="../js/backup.js"></script>

    <!-- Scroll-to-Top -->
    <script src="../js/scroll-top.js"></script>

    <!-- Dark Mode -->
    <script src="../js/dark-mode.js"></script>


</body>

</html>
