<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DogBuddy - Entwicklung</title>

    <link
        rel="stylesheet"
        href="../css/styles.css"
    >
</head>


<body>

    <!-- ========================================== -->
    <!-- HEADER -->
    <!-- ========================================== -->

    <header class="header">

        <a href="../index.html">

            <img
                src="../images/logo/dogbuddy-logo-full-blank.png"
                alt="DogBuddy Logo"
                class="logo"
            >

        </a>


        <nav class="navigation">

            <a href="../index.html">
                Dashboard
            </a>

            <a href="tagebuch.html">
                Tagebuch
            </a>

            <a href="training.html">
                Training
            </a>

            <a
                href="entwicklung.html"
                class="active"
            >
                Entwicklung
            </a>

            <a href="wochenplan.html">
                Wochenplan
            </a>

            <a href="gesundheit.html">
                Gesundheit
            </a>

            <a href="galerie.html">
                Galerie
            </a>

        </nav>

    </header>


    <!-- ========================================== -->
    <!-- HAUPTINHALT -->
    <!-- ========================================== -->

    <main class="development-page">


        <!-- ====================================== -->
        <!-- ÜBERSCHRIFT -->
        <!-- ====================================== -->

        <section class="development-header">

            <div>

                <p class="eyebrow">
                    ENTWICKLUNG
                </p>

                <h1>
                    Majors Entwicklung
                </h1>

                <p>
                    Gewicht und Größe im Blick behalten.
                </p>

            </div>


            <!-- POPUP ÖFFNEN -->

            <button
                type="button"
                id="open-measurement-form"
                class="gallery-add-button"
            >

                <span class="gallery-add-icon">
                    ＋
                </span>

                Neue Messung

            </button>

        </section>


        <!-- ====================================== -->
        <!-- BISHERIGE MESSUNGEN -->
        <!-- ====================================== -->

        <section class="measurement-history">

            <p class="eyebrow">
                VERLAUF
            </p>

            <h2>
                Bisherige Messungen
            </h2>


            <table class="measurement-table">

                <thead>

                    <tr>

                        <th>
                            Datum
                        </th>

                        <th>
                            Gewicht
                        </th>

                        <th>
                            Schulterhöhe
                        </th>

                        <th>
                            Aktion
                        </th>

                    </tr>

                </thead>


                <tbody id="measurement-list">

                    <!--
                        Hier fügt entwicklung.js
                        automatisch die gespeicherten
                        Messungen ein.
                    -->

                </tbody>

            </table>

        </section>

    </main>


    <!-- ========================================== -->
    <!-- POPUP - NEUE MESSUNG -->
    <!-- ========================================== -->

    <div
        id="measurement-form-modal"
        class="app-modal"
    >

        <div class="app-modal-content">


            <!-- ================================== -->
            <!-- POPUP KOPF -->
            <!-- ================================== -->

            <div class="app-modal-header">

                <div>

                    <p class="eyebrow">
                        ENTWICKLUNG
                    </p>

                    <h2>
                        Neue Messung
                    </h2>

                </div>


                <button
                    type="button"
                    id="close-measurement-form"
                    class="app-modal-close"
                    aria-label="Popup schließen"
                >
                    ×
                </button>

            </div>


            <!-- ================================== -->
            <!-- POPUP INHALT -->
            <!-- ================================== -->

            <div class="app-modal-body">


                <!-- DATUM -->

                <div class="form-group">

                    <label for="measurement-date">
                        Datum
                    </label>

                    <input
                        type="date"
                        id="measurement-date"
                    >

                </div>


                <!-- GEWICHT -->

                <div class="form-group">

                    <label for="measurement-weight">
                        Gewicht in kg
                    </label>

                    <input
                        type="number"
                        id="measurement-weight"
                        step="0.1"
                        min="0"
                        placeholder="z. B. 8,4"
                    >

                </div>


                <!-- SCHULTERHÖHE -->

                <div class="form-group">

                    <label for="measurement-height">
                        Schulterhöhe in cm
                    </label>

                    <input
                        type="number"
                        id="measurement-height"
                        step="0.1"
                        min="0"
                        placeholder="z. B. 35"
                    >

                </div>

            </div>


            <!-- ================================== -->
            <!-- POPUP BUTTONS -->
            <!-- ================================== -->

            <div class="app-modal-buttons">


                <!-- ABBRECHEN -->

                <button
                    type="button"
                    id="cancel-measurement-form"
                    class="app-cancel-button"
                >
                    Abbrechen
                </button>


                <!-- SPEICHERN -->

                <button
                    type="button"
                    id="save-measurement"
                    class="primary-button"
                >
                    Messung speichern
                </button>

            </div>

        </div>

    </div>


    <!-- ========================================== -->
    <!-- JAVASCRIPT -->
    <!-- ========================================== -->

    <script src="../js/entwicklung.js"></script>

</body>

</html>
